[project]
name = "coreassist-5g-rag"
version = "0.1.0"
description = "A RAG-based 5G Packet Core troubleshooting assistant with evaluation, monitoring, and user feedback."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dlt>=1.29.0",
    "logfire>=4.37.0",
    "numpy>=2.4.6",
    "openai>=2.46.0",
    "pandas>=3.0.3",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.0",
    "streamlit>=1.59.2",
    "tiktoken>=0.13.0",
    "tqdm>=4.69.0",
]
